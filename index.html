<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arena Darts</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #f97316;
      --shield: #3b82f6;
      --coin: #eab308;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
  background-color: var(--bg);
  background-image: url('arena1.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 1rem;
}

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .setup-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    /* -------------------------------------------------------------
       1. SETUP PAGE TEXT COLOR: RED
       ------------------------------------------------------------- */
    #setup-screen, 
    #setup-screen h2, 
    #setup-screen label, 
    #setup-screen p {
      color: #ef4444; /* Red text */
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ef4444; /* Red text inside inputs */
      font-size: 1rem;
    }

    .player-inputs {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .player-input-row {
      display: flex;
      gap: 0.5rem;
    }

    .p-name { flex: 2; }
    .p-target { flex: 1; }

    button {
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: white;
      border-radius: 6px;
      font-size: 1.1rem;
    }

    .btn-secondary {
      background: #334155;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    /* Game Screen Rules */
    .turn-status {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: var(--accent);
    }

    .coins-container {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .coin {
      background: rgba(234, 179, 8, 0.15);
      border: 2px dashed var(--coin);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      animation: pulse 1.5s infinite alternate;
    }

    .coin.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      animation: none;
    }

    @keyframes pulse {
      0% { transform: scale(0.98); }
      100% { transform: scale(1.02); }
    }

    /* Player Grid & Cards */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .player-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 1rem;
      border: 2px solid var(--border);
      position: relative;
      transition: all 0.3s;
    }

    /* -------------------------------------------------------------
       2. GAME PAGE PLAYER NAME COLORS (DISTINCT PER PLAYER)
       ------------------------------------------------------------- */
    .players-grid .player-card:nth-child(1) h2,
    .players-grid .player-card:nth-child(1) h3 { color: #f87171; } /* Red */

    .players-grid .player-card:nth-child(2) h2,
    .players-grid .player-card:nth-child(2) h3 { color: #60a5fa; } /* Blue */

    .players-grid .player-card:nth-child(3) h2,
    .players-grid .player-card:nth-child(3) h3 { color: #4ade80; } /* Green */

    .players-grid .player-card:nth-child(4) h2,
    .players-grid .player-card:nth-child(4) h3 { color: #facc15; } /* Yellow */

    .players-grid .player-card:nth-child(5) h2,
    .players-grid .player-card:nth-child(5) h3 { color: #c084fc; } /* Purple */

    .players-grid .player-card:nth-child(6) h2,
    .players-grid .player-card:nth-child(6) h3 { color: #fb923c; } /* Orange */

    .players-grid .player-card:nth-child(7) h2,
    .players-grid .player-card:nth-child(7) h3 { color: #38bdf8; } /* Cyan */

    .players-grid .player-card:nth-child(8) h2,
    .players-grid .player-card:nth-child(8) h3 { color: #f472b6; } /* Pink */

    /* Status Tints */
    .player-card.low-hp {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
    }

    .player-card.active-turn {
      border-color: var(--accent) !important;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
    }

    .player-card.eliminated {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--accent);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 0.5rem 0;
      font-size: 1.1rem;
    }

    .hp { color: #f87171; font-weight: bold; }
    .shield { color: #60a5fa; font-weight: bold; }
    .target-num { font-size: 0.9rem; color: var(--subtext); }

    /* Actions Grid */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .actions-grid.has-quad {
      grid-template-columns: repeat(4, 1fr);
    }

    .btn-action {
      background: #334155;
      color: white;
      padding: 0.4rem;
      font-size: 0.8rem;
      border-radius: 4px;
    }

    .btn-action:hover:not(:disabled) {
      filter: brightness(1.2);
    }

    /* Controls Bar */
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .btn-control {
      flex: 1;
      min-width: 100px;
      padding: 0.75rem;
      font-size: 0.9rem;
    }

    .btn-bull { background: var(--shield); color: white; }
    .btn-miss { background: #475569; color: white; }
    .btn-next { background: var(--accent); color: white; }
    .btn-undo { background: #64748b; color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 ARENA DARTS</h1>

    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="setup-card">
      <h2>Game Setup</h2>
      <div class="input-group">
        <label>Board Type</label>
        <select id="board-type">
          <option value="basic">Basic Board (Single, Double, Triple)</option>
          <option value="quad">Quad Board (+ Quad Ring)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Players (Minimum 2)</label>
        <div id="player-inputs" class="player-inputs">
          <div class="player-input-row">
            <input type="text" placeholder="Player 1 Name" class="p-name" value="Player 1">
            <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="20">
          </div>
          <div class="player-input-row">
            <input type="text" placeholder="Player 2 Name" class="p-name" value="Player 2">
            <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="19">
          </div>
        </div>
        <button type="button" class="btn-secondary" onclick="addPlayerInput()">+ Add Player</button>
      </div>
      <p style="font-size: 0.85rem; margin-bottom: 1rem;">
        * Weak Hand Target: Each player enters the segment hit during their preliminary weak-hand throw.
      </p>
      <button class="btn-primary" onclick="startGame()">Start Battle</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
      <div id="healer-banner" class="banner hidden">✨ Healer's Round Active! Hit your target to heal! ✨</div>
      <div id="turn-status" class="turn-status">Darts Thrown: 0 / 3</div>
      <div id="coins-container" class="coins-container"></div>
      <div id="players-grid" class="players-grid"></div>
      <div class="controls">
        <button id="btn-miss" class="btn-control btn-miss" onclick="registerThrow('miss')">Miss</button>
        <button class="btn-control btn-bull" onclick="registerThrow('outer-bull')">Outer Bull (+1 Shield)</button>
        <button class="btn-control btn-bull" onclick="registerThrow('dbull')">D-Bull (+3 Shield)</button>
        <button class="btn-control btn-undo" onclick="undoLastAction()">Undo</button>
        <button class="btn-control btn-next" onclick="nextTurn()">Next Turn ➔</button>
      </div>
    </div>
  </div>
  <script>
    let players = [];
    let currentPlayerIndex = 0;
    let dartsThrown = 0;
    let history = [];
    let boardType = 'basic';

    function addPlayerInput() {
      const container = document.getElementById('player-inputs');
      const count = container.children.length + 1;
      const row = document.createElement('div');
      row.className = 'player-input-row';
      row.innerHTML = `
        <input type="text" placeholder="Player ${count} Name" class="p-name" value="Player ${count}">
        <input type="number" placeholder="Target #" class="p-target" min="1" max="20" value="${21 - count > 0 ? 21 - count : 20}">
      `;
      container.appendChild(row);
    }

    function startGame() {
      const nameInputs = document.querySelectorAll('.p-name');
      const targetInputs = document.querySelectorAll('.p-target');
      boardType = document.getElementById('board-type').value;

      players = [];
      nameInputs.forEach((input, index) => {
        const name = input.value.trim() || `Player ${index + 1}`;
        const target = parseInt(targetInputs[index].value, 10) || 20;
        players.push({
          id: index,
          name: name,
          target: target,
          hp: 15,
          shield: 0,
          eliminated: false
        });
      });

      if (players.length < 2) {
        alert('Please add at least 2 players.');
        return;
      }

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      renderGame();
    }

    function renderGame() {
      const grid = document.getElementById('players-grid');
      grid.innerHTML = '';

      players.forEach((player, index) => {
        const card = document.createElement('div');
        let cardClass = 'player-card';
        if (index === currentPlayerIndex) cardClass += ' active-turn';
        if (player.hp <= 5 && !player.eliminated) cardClass += ' low-hp';
        if (player.eliminated) cardClass += ' eliminated';

        card.className = cardClass;

        const hasQuad = boardType === 'quad';
        const actionsGridClass = hasQuad ? 'actions-grid has-quad' : 'actions-grid';

        card.innerHTML = `
          ${index === currentPlayerIndex ? '<span class="badge">ACTIVE</span>' : ''}
          <h2>${player.name}</h2>
          <div class="stats">
            <span class="hp">HP: ${player.hp}</span>
            <span class="shield">Shield: ${player.shield}</span>
          </div>
          <div class="target-num">Target: #${player.target}</div>
          
          <div class="${actionsGridClass}">
            <button class="btn-action" onclick="hitTarget(${index}, 1)" ${player.eliminated ? 'disabled' : ''}>Single</button>
            <button class="btn-action" onclick="hitTarget(${index}, 2)" ${player.eliminated ? 'disabled' : ''}>Double</button>
            <button class="btn-action" onclick="hitTarget(${index}, 3)" ${player.eliminated ? 'disabled' : ''}>Triple</button>
            ${hasQuad ? `<button class="btn-action" onclick="hitTarget(${index}, 4)" ${player.eliminated ? 'disabled' : ''}>Quad</button>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('turn-status').innerText = `Darts Thrown: ${dartsThrown} / 3`;
    }

    function registerThrow(type) {
      if (dartsThrown >= 3) return;
      saveState();

      const activePlayer = players[currentPlayerIndex];

      if (type === 'outer-bull') {
        activePlayer.shield += 1;
      } else if (type === 'dbull') {
        activePlayer.shield += 3;
      }

      dartsThrown++;
      renderGame();
    }

    function hitTarget(targetPlayerIndex, multiplier) {
      if (dartsThrown >= 3) return;
      saveState();

      const targetPlayer = players[targetPlayerIndex];
      let damage = multiplier;

      if (targetPlayer.shield > 0) {
        if (targetPlayer.shield >= damage) {
          targetPlayer.shield -= damage;
          damage = 0;
        } else {
          damage -= targetPlayer.shield;
          targetPlayer.shield = 0;
        }
      }

      targetPlayer.hp -= damage;
      if (targetPlayer.hp <= 0) {
        targetPlayer.hp = 0;
        targetPlayer.eliminated = true;
      }

      dartsThrown++;
      renderGame();
    }

    function nextTurn() {
      saveState();
      dartsThrown = 0;
      do {
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
      } while (players[currentPlayerIndex].eliminated && players.some(p => !p.eliminated));

      renderGame();
    }

    function saveState() {
      history.push(JSON.stringify({ players, currentPlayerIndex, dartsThrown }));
    }

    function undoLastAction() {
      if (history.length === 0) return;
      const lastState = JSON.parse(history.pop());
      players = lastState.players;
      currentPlayerIndex = lastState.currentPlayerIndex;
      dartsThrown = lastState.dartsThrown;
      renderGame();
    }
  </script>
</body>
</html>
